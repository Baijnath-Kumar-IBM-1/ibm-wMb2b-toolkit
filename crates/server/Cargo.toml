[package]
name = "trace-server"
description = "Toolkit v2 local HTTP API (binds 127.0.0.1 only) and UI hosting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "trace_server"
path = "src/lib.rs"

[[bin]]
name = "trace-server"
path = "src/bin/main.rs"

[lints]
workspace = true

[features]
# Compile ui/dist into the binary. Build the UI first (`pnpm build` in ui/).
embed-ui = ["dep:rust-embed"]

[dependencies]
trace-core = { path = "../core" }
trace-storage = { path = "../storage" }
trace-http = { path = "../http" }

axum.workspace = true
tower-http = { workspace = true, features = ["cors", "fs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures-util.workspace = true
rust-embed = { version = "8.13.0", optional = true }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
time.workspace = true
base64.workspace = true
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
trace-core = { path = "../core", features = ["testing"] }
tower.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
