[workspace]
resolver = "3"
members = ["crates/core", "crates/http", "crates/storage", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
getrandom = "0.4.3"
keyring = "4.2.0"
keyring-core = "1.0.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = "0.26.6"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"
axum = { version = "0.8.4", features = ["macros"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.6.4", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures-util = "0.3.31"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
